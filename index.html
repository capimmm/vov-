<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ PERIGO! Não Clique!</title>
<style>
  :root {
    --apple-blue: #0A84FF;
    --apple-red: #FF3B30;
    --apple-gray: #8E8E93;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #e5e5ea;
    /* Fundo com qualidade máxima */
    background-image: url('fundo.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    overflow: hidden;
    position: relative;
    perspective: 1200px;
  }

  /* Overlay claro para dar contraste ao card branco sem estragar o fundo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 0;
  }

  .card-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    transform-style: preserve-3d;
  }

  /* Card Branco Apple */
  .card {
    position: relative;
    width: 100%;
    background: #ffffff;
    border-radius: 36px;
    border: 1px solid rgba(0, 0, 0, 0.05);
    padding: 40px 30px;
    text-align: center;
    cursor: pointer;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.1),
      0 20px 60px rgba(0, 0, 0, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 1);
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                box-shadow 0.4s ease;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  .card:hover {
    transform: scale(1.03) translateY(-5px);
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.15),
      0 30px 80px rgba(0, 0, 0, 0.2);
  }

  .card:active {
    transform: scale(0.97);
  }

  /* Texto Engraçado */
  .danger-title {
    color: var(--apple-red);
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    animation: shakeText 0.5s ease-in-out infinite;
  }

  @keyframes shakeText {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px) rotate(-1deg); }
    75% { transform: translateX(2px) rotate(1deg); }
  }

  .danger-subtitle {
    color: #333;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  /* Imagens do Clickbait */
  .clickbait-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* A imagem do bonequinho (ponto2.jpg) */
  .funny-img {
    width: 180px;
    height: auto;
    border-radius: 16px;
    transition: transform 0.3s ease;
  }

  .card:hover .funny-img {
    transform: scale(1.08) rotate(3deg);
  }

  /* A imagem do ponto de interrogação (ponto1.jpg) */
  .question-img {
    width: 80px;
    height: auto;
    margin-top: -10px;
    animation: floatIcon 2s ease-in-out infinite;
  }

  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .hint {
    color: var(--apple-gray);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 20px;
    font-weight: 600;
    animation: hintBlink 1.5s ease-in-out infinite;
  }

  @keyframes hintBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ANIMAÇÃO DE SAÍDA (Tremida de medo) */
  .card.opening {
    animation: cardShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes cardShake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate3d(8px, 0, 0); }
    100% { transform: translate3d(0, 0, 0) scale(0); opacity: 0; }
  }

  /* ESTADO REVELADO */
  .card.revealed {
    padding: 0;
    cursor: default;
    background: #000;
    animation: revealPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }

  @keyframes revealPop {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    60% { transform: scale(1.05) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .card.revealed .content { display: none; }

  .reveal-content {
    display: none;
    position: relative;
    border-radius: 36px;
    overflow: hidden;
  }

  .card.revealed .reveal-content { display: block; }

  .reveal-content img {
    width: 100%;
    display: block;
    border-radius: 36px;
  }

  /* Brilho na imagem revelada */
  .reveal-content::after {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent 0%, transparent 40%, rgba(255, 255, 255, 0.6) 50%, transparent 60%, transparent 100%);
    pointer-events: none;
  }

  .card.revealed .reveal-content::after {
    animation: shine 1.2s ease-out 0.4s;
  }

  @keyframes shine {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  .reveal-content .caption {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    color: white;
    padding: 10px 22px;
    border-radius: 25px;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 13px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    opacity: 0;
  }

  .card.revealed .caption {
    animation: captionIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
  }

  @keyframes captionIn {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* FLASH DE LUZ */
  .flash {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
  }

  .flash.active { animation: flashAnim 0.6s ease-out; }

  @keyframes flashAnim {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* PARTÍCULAS (Cores vermelho e amarelo para combinar com o meme) */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 998;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--apple-red);
    box-shadow: 0 0 12px rgba(255, 59, 48, 0.9), 0 0 20px rgba(255, 59, 48, 0.5);
    opacity: 0;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .particle:nth-child(even) {
    background: #FFCC00;
    box-shadow: 0 0 12px rgba(255, 204, 0, 0.9), 0 0 20px rgba(255, 204, 0, 0.5);
  }

  .particle.go {
    animation: particleBurst 1s cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
  }

  @keyframes particleBurst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); }
  }
</style>
</head>
<body>

<div class="flash" id="flash"></div>
<div class="particles" id="particles"></div>

<div class="card-wrapper">
  <div class="card" id="card">
    <div class="content">
      
      <h1 class="danger-title">⚠️ PERIGO! ⚠️</h1>
      <p class="danger-subtitle">Não clique no botão abaixo!</p>

      <div class="clickbait-container">
        <!-- Imagem engraçada (ponto2.jpg) -->
        <img 
          src="ponto2.jpg" 
          alt="Clickbait" 
          class="funny-img"
        >
        
        <!-- Imagem do ponto de interrogação (ponto1.jpg) -->
        <img 
          src="ponto1.jpg" 
          alt="Dúvida" 
          class="question-img"
        >
      </div>
      
      <p class="hint">Clique para revelar</p>
    </div>

    <div class="reveal-content">
      <!-- Imagem Revelada (imagen.png) -->
      <img
        src="imagen.png"
        alt="Imagem revelada"
      >
      <div class="caption">✓ Você foi avisado!</div>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');
  const flash = document.getElementById('flash');
  const particlesContainer = document.getElementById('particles');

  // Criação das partículas
  function createParticles() {
    const count = 50; // Mais partículas para ficar caótico e engraçado
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');

      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const distance = 150 + Math.random() * 300;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;

      p.style.setProperty('--x', `${x}px`);
      p.style.setProperty('--y', `${y}px`);

      const size = 5 + Math.random() * 10;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.animationDelay = (Math.random() * 0.1) + 's';

      particlesContainer.appendChild(p);
      requestAnimationFrame(() => p.classList.add('go'));
      setTimeout(() => p.remove(), 1500);
    }
  }

  // Evento de clique
  card.addEventListener('click', () => {
    if (card.classList.contains('revealed') || card.classList.contains('opening')) return;

    // 1. Tremida de medo
    card.classList.add('opening');

    // 2. Flash
    setTimeout(() => {
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 600);
    }, 300);

    // 3. Explosão de partículas
    setTimeout(() => {
      createParticles();
    }, 400);

    // 4. Revelação
    setTimeout(() => {
      card.classList.remove('opening');
      card.classList.add('revealed');
    }, 600);
  });
</script>

</body>
</html>
